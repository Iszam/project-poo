<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpg" href="img/favicon_MW.png"/>
    <link rel="stylesheet" type="text/css" href="css/mainMotorista.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-aFq/bzH65dt+w6FI2ooMVUpc+21e0SRygnTpmBvdBgSdnuTN7QbdgL+OapgHtvPp" crossorigin="anonymous">
    <title>MW Motoristas</title>
</head>

<body>
    <section id="1" name="landingPage-Motorista">
        <div class="contenedor-lpMotorista">
            <div class="banner">
                <img id="logo" src="img/logo_MW2.png" alt="logo MW FashionDelivery">
                <h2 style="margin: 0%">MW Fashion Delivery</h2>
                <h4>Entregas</h4>
            </div>
            <div class="form-acceso">
                <h2 style="text-align:center">¡Manos a la obra!</h2>
                <form>
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Nombre de usuario o correo electrónico</label>
                        <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="hectorsauceda@gmail.com">
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputPassword1" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="exampleInputPassword1" placeholder="* * * * * * * *">
                    </div>
                    <div class="contenedor">
                    <button type="submit" class="btn-acceso" class="btn btn-primary">Acceder</button>
                    <br>
                    <p style="margin: 0%">¿Quieres formar parte de nuestro equipo?</p>
                    <b>Trabaja con nosotros</b>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <section id="2" name=" ">

    </section>


    <!--CDN Links-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/css/bootstrap.min.css"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
